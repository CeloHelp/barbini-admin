name: CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PROJECT_ID: barbini-admin
  REGION: southamerica-east1
  SERVICE_NAME: barbini-admin
  CLOUDSQL_INSTANCE: barbini-admin:southamerica-east1:barbini-admin-db

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barbini_admin_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: pnpm exec vitest run --passWithNoTests

      - name: Build application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barbini_admin_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: production
        run: pnpm build

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --set-secrets DATABASE_URL=barbini-database-url:latest,JWT_SECRET=barbini-jwt-secret:latest \
            --set-env-vars NODE_ENV=production
